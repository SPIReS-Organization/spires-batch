[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "spires-batch"
dynamic = ["version"]  # version derived from git tags via setuptools_scm
description = "SPIReS batch processing: run the retrieval at scale over stacks of granules and spacetime cubes"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Niklas Griessbaum" }]
keywords = ["snow", "remote sensing", "dask", "slurm", "batch", "SPIRES"]

# Orchestration only: spires-io loads scenes, spires-inversion inverts them,
# spires-contract validates the boundaries. dask-distributed is the engine,
# not an extra. SLURM (dask-jobqueue) stays an untested optional extra.
dependencies = [
    "spires-contract",
    "spires-io",
    "spires-inversion",
    "xarray",
    "numpy",
    "dask[distributed]",
    "h5netcdf",
]

[project.optional-dependencies]
slurm = ["dask-jobqueue"]
test = ["pytest", "rasterio", "affine"]

[project.scripts]
spires-batch = "spires_batch.cli:main"

[project.urls]
Homepage = "https://github.com/SPIReS-Organization/spires-batch"
Repository = "https://github.com/SPIReS-Organization/spires-batch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"
